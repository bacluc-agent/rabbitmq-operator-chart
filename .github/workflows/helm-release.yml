name: Publish Helm Chart
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  HELM_VERSION: 4.1.0
  HELM_IMAGE: ghcr.io/appuio/helm-v4

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: setup helm
        run: |
          mkdir -p ~/.config/helm/registry/
          echo "{}" > ~/.config/helm/registry/config.json
      - name: Derive version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Package Helm chart
        run: scripts/helm-docker.sh package . --version "${{ steps.version.outputs.VERSION }}"
      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | scripts/helm-docker.sh registry login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Push Helm chart
        run: scripts/helm-docker.sh push ./*.tgz oci://ghcr.io/${{ github.repository }}